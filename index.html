<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Drift</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="hud">
        <div><span>Score</span> <strong id="score">0</strong></div>
        <div><span>Lives</span> <strong id="lives">3</strong></div>
      </div>

      <canvas id="gameCanvas" width="960" height="540"></canvas>

      <div id="overlay" class="overlay visible">
        <h1>Star Drift</h1>
        <p>Move with WASD or Arrow Keys</p>
        <p>Shoot with Space</p>
        <button id="startButton">Start Game</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
