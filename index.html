<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moonveil Hollow</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <div class="hud">
        <div><span>Echoes</span> <strong id="score">0</strong></div>
        <div><span>Vigor</span> <strong id="lives">5</strong></div>
        <div class="controls">WASD move · J / Space strike</div>
      </div>
      <canvas id="gameCanvas" width="960" height="540" aria-label="Moonveil Hollow game"></canvas>
      <div id="overlay" class="overlay visible">
        <p class="eyebrow">A small original gothic adventure</p>
        <h1>Moonveil Hollow</h1>
        <p>Explore the forgotten caverns beneath the moonlit ruins.</p>
        <p>Move with <b>W A S D</b> · Strike with <b>J</b> or <b>Space</b></p>
        <button id="startButton">Enter the Hollow</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
